name: بررسی خودکار

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ساختار، امنیت، حریم خصوصی و نسخهٔ قابل حمل
        run: python3 -I tools/check.py
